<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>
  /* ▼ 여기만 고치면 됩니다 (Edit only these lines) ▼ */
  const CONTACT_EMAIL = "jbiglion22@gmail.com";   // 문의 메일: 모든 언어에 함께 쓰입니다
  const EFFECTIVE_DATE = "2026-10-29";           // 시행일

<title>Korean Study — Privacy Policy</title>
<meta name="description" content="Privacy policy for the Korean Study app.">
<meta name="theme-color" content="#2347C5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6FA;--surface:#FFFFFF;--text:#16192C;--muted:#5B6178;--primary:#2347C5;--on-primary:#FFFFFF;--outline:#E4E7F0;--hero:#2347C5;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1220;--surface:#181B2E;--text:#ECEEF7;--muted:#A3A9C2;--primary:#8CA6FF;--on-primary:#0B1230;--outline:#2A2F47;--hero:#1B2A6B;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Be Vietnam Pro","Noto Sans KR",system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
html:lang(ko) body{font-family:"Noto Sans KR","Be Vietnam Pro",system-ui,sans-serif;word-break:keep-all}
a{color:var(--primary)}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--outline)}
.bar{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:var(--text);text-decoration:none}
.logo{width:36px;height:36px;border-radius:10px;background:var(--hero);color:#fff;display:grid;place-items:center;font-family:"Noto Sans KR",sans-serif;font-weight:700;font-size:19px}
.lang{display:flex;gap:4px;margin-left:auto;border:1px solid var(--outline);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{font:inherit;font-size:13px;padding:4px 10px;border:0;border-radius:999px;background:none;color:var(--muted);cursor:pointer;white-space:nowrap}
.lang button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
main{padding:40px 0 72px}
h1{font-size:clamp(28px,4vw,38px);line-height:1.25;margin:0 0 6px;letter-spacing:-.01em}
.eff{color:var(--muted);margin:0 0 24px}
.intro{margin:0 0 8px}
h2{font-size:20px;margin:32px 0 6px}
p{margin:0;overflow-wrap:anywhere}
footer{border-top:1px solid var(--outline);padding:24px 0;color:var(--muted);font-size:14px}
footer a{color:var(--muted)}
@media (max-width:420px){.brand span{display:none}}
</style>
</head>
<body>
<header><div class="wrap bar">
  <a class="brand" href="index.html"><div class="logo" aria-hidden="true">한</div><span>Korean Study</span></a>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en" lang="en">English</button>
    <button type="button" data-lang="ko" lang="ko">한국어</button>
    <button type="button" data-lang="vi" lang="vi">Tiếng Việt</button>
  </div>
</div></header>

<main class="wrap">
  <h1 id="title">Privacy Policy</h1>
  <p class="eff" id="eff"></p>
  <p class="intro" id="intro"></p>
  <div id="sections"></div>
</main>

<footer><div class="wrap">© 2026 Korean Study · <a id="contact-link" href="#"></a></div></footer>

<script>
const T = {
en: {
  title: "Privacy Policy", page: "Korean Study — Privacy Policy", effective: "Effective date: {date}", contact: "Contact",

  sections: [
    ["Information we collect", "The app does not ask for your name, email, or any account. We, the developer, do not receive your learning records or other personal information."],
    ["Data stored on your device", "To save your learning, the app stores the following only on your device: lesson and quiz progress, your review list and saved words, study time, and your settings (such as explanation language, daily goal, and reminder time)."],
    ["Advertising", "The app shows ads through Google AdMob. To show ads, limit how often they appear, measure them, and prevent fraud, Google may collect and use information from your device, such as the advertising ID, IP address, and how you interact with ads. Ads are limited to content suitable for general audiences. Learn how Google uses this information at https://policies.google.com/technologies/partner-sites"],

ko: {
  title: "개인정보처리방침", page: "Korean Study — 개인정보처리방침", effective: "시행일: {date}", contact: "문의",
  intro: "이 개인정보처리방침은 Korean Study 앱(이하 “앱”)이 정보를 어떻게 다루는지 설명합니다.",
  sections: [

    ["기기 백업", "Android 설정에서 백업이 켜져 있으면 Android가 앱 데이터를 기기 백업에 포함할 수 있습니다. 이 백업은 사용자의 Google 계정과 설정에 따라 Google이 관리하며 개발자가 관리하지 않습니다."],
    ["알림", "매일 알림을 켜면 앱이 기기에서 알림을 예약합니다. 알림은 처음에 꺼져 있으며 언제든 끌 수 있습니다."],
    ["음성 읽기", "소리는 기기에 설치된 음성 합성(TTS) 엔진으로 재생합니다. 앱은 읽는 문장을 어디에도 보내지 않습니다."],
    ["어린이", "앱은 모든 연령의 학습자가 사용할 수 있습니다. 개발자는 어린이의 개인정보를 의도적으로 수집하지 않습니다."],
    ["데이터 삭제", "기기 설정에서 앱 저장공간을 지우거나 앱을 삭제하면 모든 앱 데이터가 삭제됩니다."],
    ["방침의 변경", "이 방침이 바뀌면 이 페이지와 위의 시행일을 고칩니다."],
    ["문의", "이 방침에 대해 궁금한 점은 다음 주소로 문의해 주세요: {email}"]
  ]
},
vi: {
  title: "Chính sách quyền riêng tư", page: "Korean Study — Chính sách quyền riêng tư", effective: "Ngày có hiệu lực: {date}", contact: "Liên hệ",
  intro: "Chính sách này giải thích cách ứng dụng Korean Study (“ứng dụng”) xử lý thông tin.",
  sections: [
    ["Thông tin chúng tôi thu thập", "Ứng dụng không yêu cầu tên, email hay tài khoản. Chúng tôi (nhà phát triển) không nhận dữ liệu học tập hay bất kỳ thông tin cá nhân nào khác của bạn."],
    ["Dữ liệu lưu trên thiết bị", "Để lưu quá trình học, ứng dụng chỉ lưu các thông tin sau trên thiết bị của bạn: tiến độ bài học và bài kiểm tra, danh sách ôn tập và từ đã lưu, thời gian học, và cài đặt (như ngôn ngữ giải thích, mục tiêu mỗi ngày, giờ nhắc)."],
    ["Quảng cáo", "Ứng dụng hiển thị quảng cáo qua Google AdMob. Để hiển thị quảng cáo, giới hạn số lần xuất hiện, đo lường hiệu quả và ngăn gian lận, Google có thể thu thập và sử dụng thông tin từ thiết bị như mã nhận dạng quảng cáo, địa chỉ IP và cách bạn tương tác với quảng cáo. Quảng cáo được giới hạn ở nội dung phù hợp với mọi lứa tuổi. Xem cách Google sử dụng thông tin này tại: https://policies.google.com/technologies/partner-sites"],
    ["Sự đồng ý và lựa chọn của bạn", "Ở những khu vực cần sự đồng ý (như Khu vực Kinh tế Châu Âu, Vương quốc Anh và Thụy Sĩ), ứng dụng hiển thị biểu mẫu đồng ý của Google trước khi dùng quảng cáo cá nhân hóa. Bạn có thể thay đổi lựa chọn bất cứ lúc nào trong Cài đặt → Tùy chọn quyền riêng tư. Bạn cũng có thể đặt lại hoặc xóa mã nhận dạng quảng cáo trong cài đặt Android."],
    ["Truy cập internet", "Ứng dụng chỉ dùng internet để tải quảng cáo. Bài học, bài kiểm tra và ôn tập vẫn dùng được khi không có mạng, và ứng dụng không gửi dữ liệu học tập của bạn qua mạng."],

    ["Thông báo", "Nếu bạn bật nhắc học mỗi ngày, ứng dụng sẽ đặt lịch thông báo trên thiết bị. Nhắc nhở mặc định đang tắt và bạn có thể tắt bất cứ lúc nào."],
    ["Đọc thành tiếng", "Âm thanh được phát bằng công cụ chuyển văn bản thành giọng nói (TTS) có sẵn trên thiết bị. Ứng dụng không gửi nội dung được đọc đi đâu cả."],

    ["Xóa dữ liệu", "Bạn có thể xóa toàn bộ dữ liệu bằng cách xóa bộ nhớ của ứng dụng trong cài đặt thiết bị hoặc gỡ cài đặt ứng dụng."],
    ["Thay đổi chính sách", "Nếu chính sách thay đổi, chúng tôi sẽ cập nhật trang này và ngày có hiệu lực ở trên."],
    ["Liên hệ", "Nếu có câu hỏi về chính sách này, vui lòng liên hệ {email}."]
  ]
}};

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function rich(s){
  return esc(s)
    .replace(/https:\/\/\S+/g,u=>`<a href="${u}" rel="noopener">${u}</a>`)
    .replace("{email}",`<a href="mailto:${esc(CONTACT_EMAIL)}">${esc(CONTACT_EMAIL)}</a>`);
}

// 언어: ?lang= → 이전에 고른 언어 → 브라우저 언어 → 영어
function pickLang(){
  const q=new URLSearchParams(location.search).get("lang");
  if(T[q])return q;
  try{const saved=localStorage.getItem("ks-lang");if(T[saved])return saved;}catch(e){}
  for(const l of (navigator.languages||[navigator.language||"en"])){
    const base=String(l).toLowerCase().split("-")[0];
    if(T[base])return base;
  }
  return "en";
}

function apply(lang){
  const t=T[lang];
  document.documentElement.lang=lang;
  document.title=t.page;
  document.getElementById("title").textContent=t.title;
  document.getElementById("eff").textContent=t.effective.replace("{date}",EFFECTIVE_DATE);
  document.getElementById("intro").textContent=t.intro;
  document.getElementById("sections").innerHTML=t.sections.map(([h,b])=>`<h2>${esc(h)}</h2><p>${rich(b)}</p>`).join("");
  const c=document.getElementById("contact-link");
  c.textContent=`${t.contact}: ${CONTACT_EMAIL}`;
  c.href=`mailto:${CONTACT_EMAIL}`;
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
}

apply(pickLang());
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{
  apply(b.dataset.lang);
  try{localStorage.setItem("ks-lang",b.dataset.lang);}catch(e){}
  const u=new URL(location.href);u.searchParams.set("lang",b.dataset.lang);history.replaceState(null,"",u);
}));
</script>
</body>
</html>
