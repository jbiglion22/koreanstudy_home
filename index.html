.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:var(--text);text-decoration:none}

.note{margin-top:14px;font-size:14px;color:var(--on-hero-muted)}

.phone .hello{color:#5B6178;margin:2px 0 12px}
.m-hero{background:#2347C5;color:#fff;border-radius:16px;padding:14px}
.m-hero .u{color:#D3DCF7;font-weight:600}

.card{background:var(--surface);border:1px solid var(--outline);border-radius:20px;padding:24px}

details{border-top:1px solid var(--outline);padding-top:16px}

const SIT_KO = ["식당","카페","택시","지하철","쇼핑","길","약국","호텔","소개","도움"];

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function linkify(s){
  return esc(s)
    .replace(/https:\/\/[^\s]+?(?=[.]?(\s|$))/g,u=>`<a href="${u}" rel="noopener">${u}</a>`)
    .replace("{email}",`<a href="mailto:${CONTACT}">${CONTACT}</a>`);
}

function pickLang(){
  const q=new URLSearchParams(location.search).get("lang");
  if(T[q])return q;
  try{const saved=localStorage.getItem("ks-lang");if(T[saved])return saved;}catch(e){}
  for(const l of (navigator.languages||[navigator.language||"en"])){
    const base=String(l).toLowerCase().split("-")[0];
    if(T[base])return base;
  }
  return "en";
}

function apply(lang){
  const t=T[lang];
  document.documentElement.lang=lang;
  document.title=t.title;
  document.querySelector('meta[name="description"]').content=t.description;
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=t[el.dataset.i18n];});
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{el.innerHTML=t[el.dataset.i18nHtml];});
  document.querySelectorAll("[data-i18n-aria]").forEach(el=>{el.setAttribute("aria-label",t[el.dataset.i18nAria]);});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
  document.getElementById("sit-list").innerHTML=t.sits.map((s,i)=>
    lang==="ko"?`<span class="chip">${esc(s)}</span>`:`<span class="chip"><span lang="ko">${SIT_KO[i]}</span>${esc(s)}</span>`).join("");
  const p=t.policy;
  document.getElementById("policy-body").innerHTML=
    `<p class="eff">${esc(p.effective.replace("{date}",EFFECTIVE))}</p><p>${esc(p.intro)}</p>`+
    p.sections.map(([h,b])=>`<h3>${esc(h)}</h3><p>${linkify(b)}</p>`).join("");
}

let current=pickLang();
apply(current);
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{
  current=b.dataset.lang; apply(current);
  try{localStorage.setItem("ks-lang",current);}catch(e){}
  const u=new URL(location.href);u.searchParams.set("lang",current);history.replaceState(null,"",u);
}));
function openPolicyIfHash(){if(location.hash==="#policy"){document.getElementById("policy").open=true;}}
document.getElementById("footer-policy").addEventListener("click",()=>{document.getElementById("policy").open=true;});
window.addEventListener("hashchange",openPolicyIfHash);openPolicyIfHash();
</script>
