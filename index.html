*{box-sizing:border-box}html{scroll-behavior:smooth}

html:lang(ko) body{font-family:"Noto Sans KR","Be Vietnam Pro",system-ui,sans-serif;word-break:keep-all}
a{color:var(--primary)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--outline)}
.bar{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:var(--text);text-decoration:none}
.logo{width:36px;height:36px;border-radius:10px;background:var(--hero);color:#fff;display:grid;place-items:center;font-family:"Noto Sans KR",sans-serif;font-weight:700;font-size:19px}
nav.links{display:flex;gap:20px;margin-left:auto}nav.links a{color:var(--muted);text-decoration:none;font-size:15px}nav.links a:hover{color:var(--text)}
.lang{display:flex;gap:4px;border:1px solid var(--outline);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{font:inherit;font-size:13px;padding:4px 10px;border:0;border-radius:999px;background:none;color:var(--muted);cursor:pointer;white-space:nowrap}
.lang button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.hero{background:var(--hero);color:var(--on-hero);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:end;padding-top:64px}
.hero .copy{padding-bottom:64px}
.eyebrow{display:inline-block;font-size:14px;font-weight:600;background:rgba(255,255,255,.14);padding:5px 12px;border-radius:999px;color:var(--on-hero-muted)}
.hero h1{font-size:clamp(34px,5vw,54px);line-height:1.15;margin:18px 0 16px;letter-spacing:-.02em}
.hero p.sub{font-size:18px;color:var(--on-hero-muted);margin:0 0 28px;max-width:34em}
.note{margin-top:0;font-size:14px;color:var(--on-hero-muted)}
.phone{width:min(300px,86%);margin:0 auto;border-radius:36px 36px 0 0;border:10px solid #0B0F1F;border-bottom:0;background:#F5F6FA;color:#16192C;padding:22px 14px 18px;box-shadow:0 30px 60px rgba(0,0,0,.35);font-size:12px;line-height:1.4;text-align:left}
.phone .hi{font-family:"Noto Sans KR",sans-serif;font-weight:700;font-size:20px}
.phone .hello{color:#5B6178;margin:2px 0 12px}
.m-hero{background:#2347C5;color:#fff;border-radius:16px;padding:14px}
.m-hero .u{color:#D3DCF7;font-weight:600}
.m-hero .glyphs{font-family:"Noto Sans KR",sans-serif;font-size:30px;font-weight:700;letter-spacing:.3em;margin:6px 0 8px}
.m-track{height:6px;border-radius:3px;background:rgba(255,255,255,.25)}.m-track i{display:block;height:100%;width:35%;border-radius:3px;background:#fff}
.m-btn{margin-top:12px;background:#fff;color:#2347C5;border-radius:10px;text-align:center;padding:8px;font-weight:700}
.m-card{background:#fff;border:1px solid #E4E7F0;border-radius:14px;padding:12px;margin-top:10px}
.m-card b{display:block}
.m-goal{display:flex;justify-content:space-between;font-weight:700}.m-goal span{color:#5B6178;font-weight:400}
.m-bar{height:6px;border-radius:3px;background:#E8EDFB;margin-top:8px}.m-bar i{display:block;height:100%;width:60%;border-radius:3px;background:#2347C5}
.m-ko{font-family:"Noto Sans KR",sans-serif;font-size:16px;font-weight:700;margin:4px 0 0}
.m-sub{color:#5B6178}
section{padding:80px 0}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:var(--surface);border:1px solid var(--outline);border-radius:20px;padding:24px}
.ico{width:48px;height:48px;border-radius:14px;background:var(--soft);color:var(--primary);display:grid;place-items:center;font-family:"Noto Sans KR",sans-serif;font-weight:700;font-size:22px}
.card h3{font-size:19px;margin:16px 0 8px}.card p{margin:0;color:var(--muted);font-size:15px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.step{padding:24px;border-radius:20px;background:var(--soft)}
.step b{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--primary);color:var(--on-primary);font-size:16px}
.step h3{margin:14px 0 6px;font-size:19px}.step p{margin:0;color:var(--muted);font-size:15px}
.situations{display:flex;flex-wrap:wrap;gap:10px;margin-top:-12px}

.chip span{font-family:"Noto Sans KR",sans-serif;font-weight:700;margin-right:6px;color:var(--primary)}
.privacy{background:var(--surface);border:1px solid var(--outline);border-radius:24px;padding:36px}
.privacy h2{margin:0 0 8px;font-size:26px}.privacy>p{margin:0;color:var(--muted)}

</head>

<section id="privacy" style="padding-top:0"><div class="wrap">

</div></section>
</main>

  sits: ["Nhà hàng","Quán cà phê","Taxi","Tàu điện ngầm","Mua sắm","Hỏi đường","Hiệu thuốc","Khách sạn","Giới thiệu bản thân","Nhờ giúp đỡ"],

  footer_contact: "Liên hệ", footer_made: "Dành cho mọi người học tiếng Hàn"

const SIT_KO = ["식당","카페","택시","지하철","쇼핑","길","약국","호텔","소개","도움"];

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function pickLang(){
  const q=new URLSearchParams(location.search).get("lang");
  if(T[q])return q;
  try{const saved=localStorage.getItem("ks-lang");if(T[saved])return saved;}catch(e){}
  for(const l of (navigator.languages||[navigator.language||"en"])){
    const base=String(l).toLowerCase().split("-")[0];
    if(T[base])return base;
  }
  return "en";
}

function apply(lang){
  const t=T[lang];
  document.documentElement.lang=lang;
  document.title=t.title;
  document.querySelector('meta[name="description"]').content=t.description;
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=t[el.dataset.i18n];});
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{el.innerHTML=t[el.dataset.i18nHtml];});
  document.querySelectorAll("[data-i18n-aria]").forEach(el=>{el.setAttribute("aria-label",t[el.dataset.i18nAria]);});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
  document.getElementById("sit-list").innerHTML=t.sits.map((s,i)=>
    lang==="ko"?`<span class="chip">${esc(s)}</span>`:`<span class="chip"><span lang="ko">${SIT_KO[i]}</span>${esc(s)}</span>`).join("");
}

let current=pickLang();
apply(current);
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{
  current=b.dataset.lang; apply(current);
  try{localStorage.setItem("ks-lang",current);}catch(e){}
  const u=new URL(location.href);u.searchParams.set("lang",current);history.replaceState(null,"",u);
}));
document.getElementById("contact").href="mailto:"+CONTACT;
</script>
